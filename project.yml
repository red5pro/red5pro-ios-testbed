name: WebRTCTestBed
options:
  bundleIdPrefix: com.infrared5.test.testbed

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: 114.0.0
  Red5WebRTCKit:
    path: /Users/mustafaboleken/Documents/GitHub/red5pro-ios-sdk/Red5WebRTCKit

targets:
  WebRTCTestBed:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: WebRTCTestBed
    dependencies:
      - package: WebRTC
      - package: Red5WebRTCKit

  WebRTCTestBedTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES      # ← auto-generate
    dependencies:
      - target: WebRTCTestBed
      - package: Red5WebRTCKit
      - package: WebRTC

 WebRTCTestBedUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES      # ← auto-generate
    dependencies:
      - target: WebRTCTestBed   # UI tests run your app target

schemes:
  WebRTCTestBed:
    build:
      targets:
        WebRTCTestBed: all
        WebRTCTestBedTests: test
        WebRTCTestBedUITests: test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: WebRTCTestBedTests
        - name: WebRTCTestBedUITests
