name: SampleApp
options:
  bundleIdPrefix: com.red5

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: 114.0.0
  Red5WebRTCKit:
    path: /Users/mustafaboleken/Documents/GitHub/red5pro-ios-sdk/Red5WebRTCKit

targets:
  SampleApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: SampleApp
    dependencies:
      - package: WebRTC
      - package: Red5WebRTCKit

  SampleAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES      # ← auto-generate  
    dependencies:
      - target: SampleApp
      - package: Red5WebRTCKit
      - package: WebRTC

  SampleAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES      # ← auto-generate  
    dependencies:
      - target: SampleApp   # UI tests run your app target

schemes:
  SampleApp:
    build:
      targets:
        SampleApp: all
        SampleAppTests: test
        SampleAppUITests: test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: SampleAppTests
        - name: SampleAppUITests
